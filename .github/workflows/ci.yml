name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate visual regression baselines (commits updated -linux.png files back to main)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  e2e:
    name: Playwright (visual · hero controls · accessibility · overflow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full write token needed only when committing snapshot updates back.
          # On normal runs the default GITHUB_TOKEN read access is sufficient.
          token: ${{ github.event.inputs.update_snapshots == 'true' && secrets.GITHUB_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Ephemeral local Supabase, not a shared remote project — CI stays
      # fully reproducible per run and never needs real project credentials.
      # `supabase start` applies supabase/migrations/*.sql and seed.sql
      # automatically. The anon key/URL below are the fixed, publicly
      # documented Supabase CLI local-dev defaults (same on every machine
      # running `supabase start`), not a real secret.
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase and export env vars
        run: |
          supabase start
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(supabase status -o env | grep '^API_URL=' | cut -d'"' -f2)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d'"' -f2)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d'"' -f2)"
          } >> "$GITHUB_ENV"

      - run: npm run build

      # `chromium` (the default install) is an open-source build without
      # H.264 decode support — the hero video never becomes playable under
      # it. `chrome` is real Google Chrome, matching the codec support the
      # site's actual visitors have. See playwright.config.ts.
      - run: npx playwright install --with-deps chrome

      - name: Run Playwright tests (normal)
        if: github.event.inputs.update_snapshots != 'true'
        run: npx playwright test

      - name: Regenerate visual baselines (update-snapshots run)
        if: github.event.inputs.update_snapshots == 'true'
        run: npx playwright test tests/e2e/visual.spec.ts tests/e2e/hero.spec.ts --update-snapshots

      - name: Commit updated snapshots back to main
        if: github.event.inputs.update_snapshots == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/visual.spec.ts-snapshots/ tests/e2e/hero.spec.ts-snapshots/
          git diff --cached --quiet || git commit -m "chore: update visual regression baselines [skip ci]"
          git push

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    name: Lighthouse CI (mobile · desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase and export env vars
        run: |
          supabase start
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(supabase status -o env | grep '^API_URL=' | cut -d'"' -f2)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d'"' -f2)"
          } >> "$GITHUB_ENV"

      - run: npm run build

      # Two independent steps, not `npm run lhci` (which chains mobile &&
      # desktop) — that chain meant a mobile failure silently skipped
      # desktop entirely, so a real CI run reported only half the picture.
      # continue-on-error lets both run regardless of each other; the final
      # step below fails the job if either did. Each config's
      # blocking/non-blocking assertions are documented in
      # tests/README.md's Enforcement table.
      - name: Lighthouse mobile
        id: lhci_mobile
        run: npm run lhci:mobile
        continue-on-error: true

      - name: Lighthouse desktop
        id: lhci_desktop
        run: npm run lhci:desktop
        continue-on-error: true

      - name: Fail if either Lighthouse run failed
        if: steps.lhci_mobile.outcome == 'failure' || steps.lhci_desktop.outcome == 'failure'
        run: exit 1

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
