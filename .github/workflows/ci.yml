name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    name: Playwright (visual · hero controls · accessibility · overflow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # `chromium` (the default install) is an open-source build without
      # H.264 decode support — the hero video never becomes playable under
      # it. `chrome` is real Google Chrome, matching the codec support the
      # site's actual visitors have. See playwright.config.ts.
      - run: npx playwright install --with-deps chrome

      - run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    name: Lighthouse CI (mobile · desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # Two independent steps, not `npm run lhci` (which chains mobile &&
      # desktop) — that chain meant a mobile failure silently skipped
      # desktop entirely, so a real CI run reported only half the picture.
      # continue-on-error lets both run regardless of each other; the final
      # step below fails the job if either did. Each config's
      # blocking/non-blocking assertions are documented in
      # tests/README.md's Enforcement table.
      - name: Lighthouse mobile
        id: lhci_mobile
        run: npm run lhci:mobile
        continue-on-error: true

      - name: Lighthouse desktop
        id: lhci_desktop
        run: npm run lhci:desktop
        continue-on-error: true

      - name: Fail if either Lighthouse run failed
        if: steps.lhci_mobile.outcome == 'failure' || steps.lhci_desktop.outcome == 'failure'
        run: exit 1

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
