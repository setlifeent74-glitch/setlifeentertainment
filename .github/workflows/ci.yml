name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    name: Playwright (visual · hero controls · accessibility · overflow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    name: Lighthouse CI (mobile · desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # §49.2 — performance/LCP/CLS/TBT are non-blocking (warn) until the
      # Phase 1 (feat/nextjs-migration) PR merges, at which point they flip
      # to blocking (error) in lighthouserc.*.json. Accessibility/best
      # practices/SEO are blocking now. See tests/README.md.
      - run: npm run lhci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
