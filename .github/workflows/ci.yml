name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    name: Playwright (visual · hero controls · accessibility · overflow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # `chromium` (the default install) is an open-source build without
      # H.264 decode support — the hero video never becomes playable under
      # it. `chrome` is real Google Chrome, matching the codec support the
      # site's actual visitors have. See playwright.config.ts.
      - run: npx playwright install --with-deps chrome

      - run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    name: Lighthouse CI (mobile · desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # §49.2 — performance/CLS/TBT and desktop LCP are blocking (error) as
      # of this Phase 1 PR; mobile LCP stays non-blocking (warn) — close but
      # not fully there on 3/5 routes. Accessibility/best practices/SEO have
      # been blocking since Phase 0. See tests/README.md's Enforcement table.
      - run: npm run lhci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
